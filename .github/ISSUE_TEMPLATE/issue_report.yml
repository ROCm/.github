name: Issue Report
description: File a report for ROCm related issues on Linux and Windows. For issues pertaining to documentation or non-bug related, please open a blank issue located below.
title: "[Issue]: "

body:
- type: markdown
  attributes:
    value: |
      Thank you for taking the time to fill out this report!

      You can acquire your OS, CPU, GPU (for filling out this report) with the following commands:

      Linux:
      ```
        echo "OS:" && cat /etc/os-release | grep -E "^(NAME=|VERSION=)";
        echo "CPU: " && cat /proc/cpuinfo | grep "model name" | sort --unique;
        echo "GPU:" && rocminfo | grep -E "^\s*(Name|Marketing Name)";
      ```
        
      Windows:
      ```
        (Get-WmiObject Win32_OperatingSystem).Version
        (Get-WmiObject win32_Processor).Name
        (Get-WmiObject win32_VideoController).Name
      ```
- type: textarea
  attributes:
    label: Problem Description
    description: Describe the issue you encountered.
  validations:
    required: true
- type: input
  attributes:
    label: Operating System
    description: What is the name and version number of the OS?
    placeholder: "e.g. Ubuntu 26.04 LTS"
  validations:
    required: true
- type: input
  attributes:
    label: CPU
    description: What CPU did you encounter the issue on?
    placeholder: "e.g. AMD Ryzen 9 5900HX with Radeon Graphics"
  validations:
    required: true
- type: input
  attributes:
    label: GPU
    description: What GPU(s) did you encounter the issue on?
    placeholder: "e.g. AMD Instinct MI300X or 2 x AMD Radeon RX 7900 XTX"
  validations:
    required: true
- type: input
  attributes:
    label: ROCm Version
    description: What version(s) of ROCm did you encounter the issue on?
    placeholder: "e.g. ROCm 10.0"
  validations:
    required: true
- type: dropdown
  attributes:
    label: Installation Method
    description: How did you install ROCm?
    options:
      - Python wheels
      - Package manager
      - Tarball
      - Built from source
      - Other (describe in Additional Information)
  validations:
    required: true
- type: textarea
  attributes:
    label: Installed ROCm Packages / Versions
    description: |
      Paste the output of the command matching your installation method above. This inventory of installed component versions is critical for triage.

      - Python wheels: `pip freeze`
      - Package manager: `apt list --installed 2>/dev/null | grep -iE "rocm|hip|amdgpu"` (use the equivalent for your package manager, e.g. `rpm -qa` on dnf/zypper systems)
    value: |
      <details>
      <summary>Installed ROCm packages / versions</summary>

      ```
      Paste output here
      ```

      </details>
  validations:
    required: false
- type: dropdown
  attributes:
    label: ROCm Component
    description: (Optional) If this issue relates to a specific ROCm component, it can be mentioned here.
    options:
      - aomp
      - aomp-extras
      - AMDMIGraphX
      - amdsmi
      - clr
      - composable_kernel
      - flang
      - half
      - HIP
      - HIPIFY
      - hip-tests
      - hipBLAS
      - hipBLAS-common
      - hipBLASLt
      - hipCUB
      - hipFFT
      - hipfort
      - hipother
      - hipRAND
      - hipSOLVER
      - hipSPARSE
      - hipSPARSELt
      - hipTensor
      - llvm-project
      - MIOpen
      - MIVisionX
      - rccl
      - rdc
      - rocAL
      - rocALUTION
      - rocBLAS
      - rocDecode
      - rocFFT
      - rocJPEG
      - rocminfo
      - rocPRIM
      - rocPyDecode
      - rocRAND
      - rocSHMEM
      - rocSOLVER
      - rocSPARSE
      - rocThrust
      - rocWMMA
      - rocm-core
      - rocm-cmake
      - rocm-examples
      - rocm_bandwidth_test
      - rocm_smi_lib
      - ROCdbgapi
      - ROCgdb
      - ROCmValidationSuite
      - ROCK-Kernel-Driver
      - ROCR-Runtime
      - rocprofiler
      - rocprofiler-compute
      - rocprofiler-register
      - rocprofiler-sdk
      - rocprofiler-systems
      - rocr_debug_agent
      - roctracer
      - rpp
      - spirv-llvm-translator
      - Tensile
      - TransferBench
    multiple: true
- type: textarea
  attributes:
    label: Steps to Reproduce
    description: (Optional) Detailed steps to reproduce the issue.
  validations:
    required: false

- type: textarea
  attributes:
    label: (Optional for Linux users) Output of rocminfo --support
    description: The output of rocminfo --support could help to better address the problem. It is pre-wrapped in a collapsible section below.
    value: |
      <details>
      <summary>rocminfo --support output</summary>

      ```
      Paste output here
      ```

      </details>
  validations:
    required: false

- type: textarea
  attributes:
    label: Additional Information
    description: (Optional) Any additional information that is relevant, e.g. relevant environment variables, dockerfiles, log files, dmesg output (on Linux), etc.
  validations:
    required: false
